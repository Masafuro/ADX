<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- Outer Blueprint Border -->
  <rect x="30" y="30" width="740" height="340" rx="10" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.4"/>

  <!-- Center Card -->
  <g transform="translate(400, 200)">
    <!-- Camera / Photo Frame Icon -->
    <rect x="-45" y="-70" width="90" height="65" rx="8" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="-38" r="16" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="26" cy="-56" r="3" fill="#64748b"/>
    <path d="M -15 -70 L -10 -78 L 10 -78 L 15 -70 Z" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Main Title -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#94a3b8" text-anchor="middle" letter-spacing="3">PHOTO COMING SOON</text>

    <!-- Subtitle -->
    <text x="0" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="1">ADX HARDWARE // IN ACTIVE R&amp;D</text>
  </g>

  <!-- Corner Crosshairs -->
  <g stroke="#64748b" stroke-width="1" stroke-opacity="0.5">
    <path d="M 45 40 L 45 50 M 40 45 L 50 45"/>
    <path d="M 755 40 L 755 50 M 750 45 L 760 45"/>
    <path d="M 45 350 L 45 360 M 40 355 L 50 355"/>
    <path d="M 755 350 L 755 360 M 750 355 L 760 355"/>
  </g>
</svg>
