<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- Blueprint Outer Frame -->
  <rect x="40" y="30" width="720" height="340" rx="8" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.4"/>

  <!-- Board Outline (8748 Form Factor representation) -->
  <g transform="translate(160, 75)">
    <!-- Main PCB Body (87:48 ratio, scaled to 480 x 250) -->
    <rect x="0" y="0" width="480" height="250" rx="12" fill="url(#board)" stroke="#0ea5e9" stroke-width="2"/>
    
    <!-- Edge Margin / Grab Area Guides -->
    <rect x="6" y="6" width="468" height="238" rx="8" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.5"/>

    <!-- 4 Corner M3 Mounting Holes (77 x 38 pitch equiv) -->
    <circle cx="28" cy="28" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="5" fill="#38bdf8" fill-opacity="0.3"/>
    
    <circle cx="452" cy="28" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="452" cy="28" r="5" fill="#38bdf8" fill-opacity="0.3"/>
    
    <circle cx="28" cy="222" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="28" cy="222" r="5" fill="#38bdf8" fill-opacity="0.3"/>
    
    <circle cx="452" cy="222" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="452" cy="222" r="5" fill="#38bdf8" fill-opacity="0.3"/>

    <!-- Unidirectional I/F Edge (Left Side Connectors) -->
    <rect x="-8" y="55" width="16" height="42" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
    <text x="18" y="80" font-family="monospace" font-size="10" fill="#94a3b8">USB-C</text>

    <!-- 20-Pin Bus Header representation -->
    <rect x="360" y="70" width="40" height="110" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <g fill="#94a3b8">
      <circle cx="370" cy="82" r="2.5"/><circle cx="390" cy="82" r="2.5"/>
      <circle cx="370" cy="98" r="2.5"/><circle cx="390" cy="98" r="2.5"/>
      <circle cx="370" cy="114" r="2.5"/><circle cx="390" cy="114" r="2.5"/>
      <circle cx="370" cy="130" r="2.5"/><circle cx="390" cy="130" r="2.5"/>
      <circle cx="370" cy="146" r="2.5"/><circle cx="390" cy="146" r="2.5"/>
      <circle cx="370" cy="162" r="2.5"/><circle cx="390" cy="162" r="2.5"/>
    </g>
    <text x="350" y="196" font-family="monospace" font-size="9" fill="#64748b">20P BUS</text>

    <!-- Center Typography -->
    <text x="220" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="24" fill="#f8fafc" text-anchor="middle">ADX CORE-U</text>
    <text x="220" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400" font-size="12" fill="#38bdf8" text-anchor="middle">8748 FORM FACTOR • ATtiny1616</text>
    
    <!-- Photo Placeholder Badge -->
    <rect x="130" y="160" width="180" height="26" rx="13" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1"/>
    <text x="220" y="177" font-family="monospace" font-size="10" fill="#bae6fd" text-anchor="middle">[ Prototype Photo Coming Soon ]</text>
  </g>

  <!-- Technical Labels on Outer Frame -->
  <text x="60" y="55" font-family="monospace" font-size="11" fill="#64748b">ADX HARDWARE ARCHITECTURE // 8748 SPECIFICATION</text>
  <text x="740" y="355" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">ENCLOSURE-FRIENDLY ARDUINO ECOSYSTEM</text>
</svg>
