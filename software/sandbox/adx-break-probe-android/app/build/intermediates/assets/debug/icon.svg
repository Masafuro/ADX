<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Circuit lines in background -->
  <path d="M 64 256 H 180 L 220 180 H 320" fill="none" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.25" stroke-linecap="round"/>
  <path d="M 448 256 H 332 L 292 332 H 192" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.25" stroke-linecap="round"/>

  <!-- Glowing Lightning Bolt / Network Nodes -->
  <path d="M 280 64 L 176 272 H 272 L 232 448 L 352 240 H 256 Z" fill="url(#neonGrad)" filter="url(#glow)"/>

  <!-- Foreground Badge Accent -->
  <circle cx="280" cy="64" r="14" fill="#00f0ff" />
  <circle cx="232" cy="448" r="14" fill="#a855f7" />
  <circle cx="64" cy="256" r="12" fill="#00f0ff" />
  <circle cx="448" cy="256" r="12" fill="#10b981" />

  <!-- ADX MR32 Text -->
  <text x="256" y="475" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#f1f5f9" letter-spacing="4">ADX MR32</text>
</svg>
